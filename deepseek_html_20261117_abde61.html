<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Secure Chat (SEC) — Download</title>
<meta name="description" content="Download Secure Chat (SEC) for Android (.apk) and Windows (.exe)." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --paper:#e6f6ee;
    --card:#ffffff;
    --ink:#0e2f2b;
    --ink-soft:#3c5f59;
    --green:#12a06a;
    --green-deep:#0b7a4f;
    --blue:#1f6feb;
    --blue-deep:#17509f;
    --line:#0e2f2b;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    color:var(--ink);
    font-family:"Space Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

    /* blueish-green, green → blue, left to right */
    background:
      radial-gradient(900px 520px at 18% -10%, rgba(255,255,255,.32), transparent 65%),
      linear-gradient(90deg,
        #8fe0be 0%,
        #74d3bd 28%,
        #66bfd6 58%,
        #78a9ee 82%,
        #8fb4f6 100%);
    background-attachment:fixed;
    background-repeat:no-repeat;

    -webkit-font-smoothing:antialiased;
  }

  /* faint dot grid so it doesn't look like a flat gradient */
  body::before{
    content:"";
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:radial-gradient(rgba(14,47,43,.14) 1px, transparent 1px);
    background-size:20px 20px;
    opacity:.35;
  }

  .wrap{ position:relative; z-index:1; max-width:900px; margin:0 auto; padding:36px 20px 64px; }

  /* ---------- header / logo ---------- */
  header{ display:flex; align-items:center; gap:18px; margin-bottom:30px; }

  .logo-slot{
    position:relative;
    flex:0 0 auto;
    width:80px; height:80px;
    border-radius:22px;
    border:2px dashed rgba(14,47,43,.38);
    background:rgba(255,255,255,.55);
    overflow:hidden;
    transition:background .15s ease, border-color .15s ease;
  }

  .logo-fallback{
    position:absolute; inset:0;
    display:grid; place-items:center; text-align:center;
    font-size:.64rem; letter-spacing:.12em; text-transform:uppercase;
    line-height:1.3;
    color:var(--ink-soft);
  }

  .logo-slot img{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:contain;
    display:none;
  }

  /* once a real image loads, drop the placeholder look */
  .logo-slot.has-logo{ border-style:solid; border-color:transparent; background:transparent; }
  .logo-slot.has-logo img{ display:block; }
  .logo-slot.has-logo .logo-fallback{ display:none; }

  h1{
    font-size:clamp(1.9rem, 5.5vw, 2.7rem);
    line-height:1; margin:0 0 7px; letter-spacing:-.03em; font-weight:700;
  }
  .pill{
    display:inline-block; vertical-align:middle; margin-left:10px;
    padding:4px 10px; border-radius:999px;
    background:var(--green); color:#fff;
    font-size:.72rem; letter-spacing:.14em; font-weight:700;
    transform:translateY(-4px);
  }
  .tagline{ margin:0; color:var(--ink-soft); font-size:.96rem; }

  .lead{
    margin:0 0 26px; max-width:52ch;
    color:var(--ink-soft); font-size:1.02rem; line-height:1.55;
  }

  /* ---------- main download buttons ---------- */
  .downloads{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(250px, 1fr));
    gap:16px;
  }

  .dl{
    display:flex; align-items:center; gap:14px;
    padding:18px 20px;
    border-radius:18px;
    text-decoration:none; color:#fff;
    border:2px solid var(--line);
    box-shadow:4px 4px 0 var(--line);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .dl:hover{ transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--line); }
  .dl:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 var(--line); }

  .dl-apk{ background:linear-gradient(160deg, #16b377, var(--green-deep)); }
  .dl-exe{ background:linear-gradient(160deg, #2f81f7, var(--blue-deep)); }

  .dl-icon{
    flex:0 0 auto; width:44px; height:44px;
    border-radius:13px; display:grid; place-items:center;
    background:rgba(255,255,255,.18);
    border:1.5px solid rgba(255,255,255,.35);
  }
  .dl-title{ display:block; font-weight:700; font-size:1.05rem; letter-spacing:-.01em; }
  .dl-meta{ display:block; font-size:.78rem; opacity:.9; margin-top:3px; letter-spacing:.02em; }

  /* ---------- github / reddit ---------- */
  .links{ display:flex; flex-wrap:wrap; gap:12px; margin-top:22px; }

  .ghost{
    display:inline-flex; align-items:center; gap:9px;
    padding:11px 16px;
    border-radius:13px;
    text-decoration:none; color:var(--ink);
    background:var(--card);
    border:2px solid var(--line);
    box-shadow:3px 3px 0 var(--line);
    font-family:inherit; font-size:.92rem; font-weight:600;
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .ghost:hover{ transform:translate(-1.5px,-1.5px); box-shadow:5px 5px 0 var(--line); }
  .ghost:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 var(--line); }
  .ghost svg{ width:17px; height:17px; }

  /* ---------- footer ---------- */
  footer{
    margin-top:38px; padding-top:18px;
    border-top:2px dashed rgba(14,47,43,.28);
    font-size:.85rem; color:var(--ink-soft);
    display:flex; flex-wrap:wrap; gap:8px; justify-content:space-between;
    align-items:center;
  }
  footer .copyright{
    font-weight:600;
    letter-spacing:.02em;
    font-size:.8rem;
    color:var(--ink);
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }
</style>
</head>

</div>

<script>
  /* ---- logo: swap in the image only if it actually loads ---- */
  const slot = document.getElementById('logoSlot');
  const logo = document.getElementById('logoImg');

  function showLogo(){ slot.classList.add('has-logo'); }

  // image may already be cached/loaded before this script runs
  if (logo.complete && logo.naturalWidth > 0) showLogo();

  logo.addEventListener('load', showLogo);
  logo.addEventListener('error', () => slot.classList.remove('has-logo'));
</script>
</body>
</html>
